name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5

      - name: Prepare static site
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p .pages
          cp index.html .pages/index.html
          cp -R public .pages/public
          touch .pages/.nojekyll
          python - <<'PY'
          import os
          from pathlib import Path

          p = Path(".pages/index.html")
          html = p.read_text(encoding="utf-8")
          html = html.replace("__SUPABASE_URL__", os.environ.get("SUPABASE_URL", ""))
          html = html.replace("__SUPABASE_PUBLISHABLE_KEY__", os.environ.get("SUPABASE_KEY", ""))
          p.write_text(html, encoding="utf-8")
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - id: deployment
        uses: actions/deploy-pages@v5
