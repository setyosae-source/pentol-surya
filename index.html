<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111" id="theme-color-meta">
  <meta name="description" content="Pentol Surya - sistem operasional multi outlet.">
  <link rel="manifest" href="./public/manifest.webmanifest">
  <link rel="icon" href="./public/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./public/icons/apple-touch-icon.svg">
  <title>Pentol Surya</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f1eb;
      --surface: #fffaf5;
      --panel: #ffffff;
      --panel-soft: #fff0e6;
      --field: #fffaf5;
      --text: #1c1715;
      --muted: #736761;
      --line: #ead5c7;
      --line-strong: #dfb49e;
      --primary: #d80c0c;
      --primary-dark: #a90707;
      --accent: #ff6a00;
      --accent-soft: #fff0df;
      --danger: #d80c0c;
      --success: #148448;
      --brand-black: #111111;
      --shadow: 0 16px 34px rgba(35, 18, 12, .12);
      --radius: 8px;
      font-family: "Segoe UI", Roboto, Arial, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d0b0b;
      --surface: #141111;
      --panel: #191515;
      --panel-soft: #241716;
      --field: #120f0f;
      --text: #fff8f0;
      --muted: #c7b7ad;
      --line: #392423;
      --line-strong: #6f2a25;
      --primary: #f02727;
      --primary-dark: #ff4b3f;
      --accent: #ff7a1a;
      --accent-soft: #2a1713;
      --danger: #ff4b4b;
      --success: #37b66a;
      --brand-black: #050505;
      --shadow: 0 18px 42px rgba(0, 0, 0, .36);
    }

    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top right, rgba(216, 12, 12, .08), transparent 32vw),
        var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-weight: 400;
    }

    button, input, select, textarea {
      font: inherit;
      min-width: 0;
    }

    button {
      cursor: pointer;
    }

    a { color: inherit; text-decoration: none; }

    .app {
      min-height: 100vh;
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
    }

    .center-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .login-screen {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: center;
      padding: clamp(20px, 5vw, 72px);
      overflow-x: hidden;
      overflow-y: auto;
      background-color: #080606;
      background-image:
        linear-gradient(90deg, rgba(5, 3, 3, .90) 0%, rgba(8, 4, 4, .70) 38%, rgba(8, 3, 3, .18) 72%, rgba(3, 2, 2, .46) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, .20), rgba(0, 0, 0, .38)),
        url('./public/brand/pentol-surya-login-bg.jpg');
      background-size: cover;
      background-position: center 54%;
    }

    .login-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 78% 60%, rgba(216, 12, 12, .12), transparent 34%),
        linear-gradient(180deg, transparent 60%, rgba(0, 0, 0, .36));
    }

    .login-shell {
      width: min(1240px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(320px, 430px) 1fr;
      align-items: center;
    }

    .login-card {
      width: 100%;
      padding: clamp(22px, 3vw, 30px);
      border-color: rgba(255, 255, 255, .24);
      border-radius: 20px;
      background: rgba(255, 250, 245, .94);
      box-shadow: 0 26px 70px rgba(0, 0, 0, .42);
      backdrop-filter: blur(16px) saturate(115%);
      -webkit-backdrop-filter: blur(16px) saturate(115%);
    }

    body[data-theme="dark"] .login-card {
      background: rgba(18, 14, 14, .91);
      border-color: rgba(255, 255, 255, .15);
    }

    .login-card .brand-block {
      margin-bottom: 22px;
    }

    .login-card .brand-title {
      font-size: 20px;
      font-weight: 700;
    }

    .login-card .brand-subtitle {
      font-size: 12px;
    }

    .login-heading {
      margin-bottom: 17px;
    }

    .login-heading h1 {
      margin: 0;
      font-size: clamp(25px, 3vw, 32px);
      line-height: 1.12;
      font-weight: 700;
    }

    .login-heading p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .login-card .tabs {
      margin: 0 0 18px;
    }

    .login-card input {
      background: color-mix(in srgb, var(--field) 94%, transparent);
    }

    .login-card .btn.primary {
      margin-top: 2px;
      min-height: 48px;
      box-shadow: 0 12px 24px rgba(216, 12, 12, .20);
    }

    .auth-card, .setup-card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      position: relative;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      min-width: 0;
    }

    .brand-block > div:last-child {
      min-width: 0;
    }

    .logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      overflow: hidden;
      background: var(--brand-black);
      color: #fff;
      border: 1px solid rgba(216, 12, 12, .62);
      box-shadow: 0 8px 20px rgba(216, 12, 12, .18);
      flex: 0 0 auto;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .04em;
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .brand-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-small .logo {
      width: 40px;
      height: 40px;
    }

    .brand-small .brand-title {
      font-size: 15px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      background: var(--panel-soft);
      border-radius: var(--radius);
      margin: 12px 0 18px;
    }

    .tab-btn {
      border: 0;
      background: transparent;
      border-radius: 7px;
      color: var(--muted);
      padding: 10px 8px;
      font-weight: 650;
    }

    .tab-btn.active {
      background: var(--panel);
      color: var(--primary);
      box-shadow: 0 6px 16px rgba(216, 12, 12, .10);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .form-grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full, .full { grid-column: 1 / -1; }

    label {
      font-weight: 650;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line-strong);
      background: var(--field);
      color: var(--text);
      border-radius: 8px;
      padding: 11px 12px;
      outline: none;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(216, 12, 12, .14);
    }

    .btn {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--panel);
      color: var(--text);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border-color: var(--primary);
    }

    .btn.ghost {
      border-color: var(--line-strong);
      background: var(--surface);
      color: var(--text);
    }

    .btn.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .btn.small {
      min-height: 34px;
      padding: 7px 10px;
      font-size: 12px;
    }

    .help {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .location-picker {
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-soft);
    }

    .location-picker-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .location-picker-head .help {
      margin-top: 3px;
    }

    .location-point-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 9px;
    }

    .location-point-tab {
      min-height: 42px;
      padding: 7px 6px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .location-point-tab.is-set::after {
      content: ' ✓';
      color: var(--success);
    }

    .location-point-tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .location-point-tab.active::after {
      color: #fff;
    }

    .outlet-location-map {
      width: 100%;
      height: 330px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--surface);
      color: var(--muted);
    }

    .map-loading,
    .map-error {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 18px;
      text-align: center;
    }

    .location-coordinate-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 9px;
    }

    .location-coordinate-item {
      min-width: 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .location-coordinate-item strong,
    .location-coordinate-item span {
      display: block;
    }

    .location-coordinate-item strong {
      margin-bottom: 3px;
      font-size: 11px;
      font-weight: 650;
    }

    .location-coordinate-item span {
      overflow: hidden;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .location-map-status {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .outlet-location-map .leaflet-control-attribution {
      font-size: 9px;
    }

    body[data-theme="dark"] .outlet-location-map .leaflet-control-zoom a {
      background: #211a18;
      color: #fff;
      border-color: #3b2a25;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
      width: 100%;
      max-width: 100%;
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 20;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 6px 4px 18px;
    }

    .nav-group {
      margin: 15px 0 8px;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 8px;
      text-align: left;
      font-weight: 650;
    }

    .nav-item span:first-child {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .nav-item.active {
      color: var(--primary);
      background: var(--accent-soft);
    }

    .main {
      min-width: 0;
      width: 100%;
      max-width: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      min-height: 70px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      width: 100%;
      max-width: 100%;
    }

    .topbar-left, .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .topbar-left {
      flex: 1 1 auto;
      overflow: hidden;
    }

    .topbar-actions {
      flex: 0 0 auto;
    }

    .burger {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line-strong);
      background: var(--panel);
      border-radius: 8px;
      display: none;
      place-items: center;
      font-size: 22px;
      line-height: 1;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 6px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--success) 16%, transparent);
      color: var(--success);
      font-size: 12px;
      white-space: nowrap;
    }

    .theme-toggle, .theme-choice {
      min-height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .theme-toggle {
      color: var(--primary);
    }

    .theme-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .theme-choice.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .card-theme {
      position: absolute;
      top: 14px;
      right: 14px;
    }

    .card-theme + .brand-block {
      padding-right: 112px;
    }

    .content {
      padding: 18px;
      max-width: 1180px;
      width: 100%;
      min-width: 0;
      overflow-x: clip;
    }

    .employee-app {
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
    }

    .employee-main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 14px 14px calc(92px + env(safe-area-inset-bottom));
    }

    .employee-topbar {
      min-height: 62px;
    }

    .employee-hero {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border: 1px solid color-mix(in srgb, var(--primary) 36%, var(--line));
      border-radius: 14px;
      background:
        radial-gradient(circle at 94% 0, rgba(255,255,255,.22), transparent 33%),
        linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 12px 28px rgba(216, 12, 12, .16);
    }

    .employee-hero .eyebrow,
    .employee-hero .page-desc {
      color: rgba(255,255,255,.86);
    }

    .employee-hero h1 {
      font-size: clamp(24px, 7vw, 32px);
    }

    .employee-hero .page-desc {
      max-width: 560px;
    }

    .employee-step {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(0,0,0,.20);
      font-size: 11px;
    }

    .employee-bottom-nav {
      position: fixed;
      z-index: 35;
      left: 50%;
      bottom: 0;
      width: min(760px, 100%);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
      padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      box-shadow: 0 -10px 28px rgba(35, 18, 12, .10);
      backdrop-filter: blur(14px);
    }

    .employee-nav-item {
      min-width: 0;
      min-height: 54px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .employee-nav-item strong {
      display: grid;
      width: 26px;
      height: 24px;
      place-items: center;
      color: inherit;
      font-size: 12px;
      font-weight: 700;
    }

    .employee-nav-item.active {
      background: var(--accent-soft);
      color: var(--primary);
    }

    .employee-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 12px;
    }

    .employee-action {
      min-height: 92px;
      display: grid;
      align-content: center;
      gap: 5px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
      color: var(--text);
      text-align: left;
    }

    .employee-action strong {
      font-size: 14px;
      font-weight: 700;
    }

    .employee-action span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .employee-action.primary-action {
      border-color: color-mix(in srgb, var(--primary) 42%, var(--line));
      background: color-mix(in srgb, var(--accent-soft) 74%, var(--panel));
    }

    .employee-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin: 12px 0;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel-soft);
    }

    .employee-tab {
      min-height: 38px;
      padding: 7px 5px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .employee-tab.active {
      background: var(--panel);
      color: var(--primary);
      box-shadow: 0 5px 14px rgba(35, 18, 12, .08);
    }

    .product-input-table {
      table-layout: fixed;
    }

    .product-input-table th:nth-child(1),
    .product-input-table td:nth-child(1) { width: 46%; }

    .product-input-table th:nth-child(2),
    .product-input-table td:nth-child(2) { width: 30%; }

    .product-input-table th:nth-child(3),
    .product-input-table td:nth-child(3) { width: 24%; }

    .product-input-table input {
      min-height: 38px;
      padding: 7px 8px;
      text-align: right;
    }

    .employee-form-title {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 700;
    }

    .employee-note {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin-top: 10px;
      padding: 10px;
      border-radius: 9px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 11px;
    }

    .camera-file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .camera-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .photo-selection {
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 9px;
      border: 1px dashed var(--line-strong);
      border-radius: 9px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
    }

    .photo-selection.ready {
      border-style: solid;
      border-color: var(--success);
      color: var(--success);
    }

    .photo-selection img {
      flex: 0 0 auto;
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 8px;
      background: #111;
    }

    .photo-selection strong,
    .photo-selection small {
      display: block;
      overflow-wrap: anywhere;
    }

    .photo-selection strong {
      font-weight: 650;
    }

    .photo-selection small {
      margin-top: 3px;
      color: var(--muted);
    }

    .camera-modal {
      width: min(520px, 100%);
    }

    .camera-view {
      position: relative;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border-radius: 12px;
      background: #050505;
    }

    .camera-view video {
      width: 100%;
      height: 100%;

    .detail-actions {

      gap: 7px;
      margin-top: 12px;
    }

    .detail-json {

      margin: 0;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--text);

      font-size: 11px;
      line-height: 1.5;

    .detail-panel {
      margin-top: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;

    .row-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

      font-weight: 650;
      font-size: 12px;
      white-space: nowrap;

    .badge.ok {

    }

    .badge.warn {

    .skeleton {

    @keyframes shimmer {

      100% { background-position: 0 0; }
    }

    .fab {

      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));

      height: 58px;

      z-index: 1;
      background: var(--panel);

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);

    .modal-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .modal-body {
      padding: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 16px;
    }

    .toast-area {
      position: fixed;
      left: 50%;
      bottom: 24px;

      gap: 8px;
      z-index: 60;
      pointer-events: none;

    .drawer-overlay {

      position: fixed;
      inset: 0;

      overflow: hidden;
    }

    .code {

      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 980px) {

      }
      body.drawer-open .sidebar { transform: translateX(0); }
      body.drawer-open .drawer-overlay { display: block; }
      .burger { display: grid; }
      .content { padding: 14px; }
      .dashboard-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar .brand-subtitle { display: none; }
    }

    @media (max-width: 760px) {

      .employee-topbar {

      }

      .employee-hero {
        padding: 15px;
        border-radius: 12px;
      }

      .employee-actions { gap: 7px; }

      .employee-action {
        min-height: 82px;
        padding: 11px;
      }

      .camera-view {
        height: min(58svh, 520px);

      }

      .location-picker {
        padding: 9px;
      }

      .location-picker-head {
        display: grid;
      }

      .location-picker-head .btn {
        width: 100%;
      }

      .outlet-location-map {
        height: min(45svh, 320px);
      }

      .location-coordinate-list {
        grid-template-columns: 1fr;
      }

      .employee-bottom-nav {
        border-left: 0;
        border-right: 0;
        border-radius: 12px 12px 0 0;
      }

      .product-input-table th,
      .product-input-table td {
        padding: 7px 5px;
        font-size: 11px;
      }

      .content {
        padding: 12px;
        padding-bottom: calc(82px + env(safe-area-inset-bottom));
      }

      .page-head {
        display: block;
        margin-bottom: 12px;
      }

      .page-desc {
        margin-top: 6px;
        line-height: 1.4;
      }

      .dashboard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .kpi-card, .panel {
        padding: 11px;
        border-radius: 10px;
      }

      .kpi-label { font-size: 11px; }
      .kpi-value {
        margin-top: 4px;
        font-size: clamp(17px, 5vw, 20px);
        line-height: 1.2;
      }

      .panel { margin-top: 9px; }
      .panel-title { margin-bottom: 8px; }

      .table-wrap {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);

      .data-table th,

        padding: 8px 6px;
        font-size: 11px;
        white-space: nowrap;
      }

      .data-table th:first-child,
      .data-table .data-row td:first-child { width: 42%; }

      .data-table th:nth-child(2),
      .data-table .data-row td:nth-child(2) { width: 27%; }

      .data-table th:nth-child(3),
      .data-table .data-row td:nth-child(3) { width: 23%; }

      .data-table th:last-child,
      .data-table .row-open-cell { width: 34px; }

      .data-table .badge {
        max-width: 100%;
        padding: 3px 6px;
        font-size: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row-toggle {
        width: 26px;
        height: 26px;
        font-size: 17px;
      }

      .inline-detail { padding: 10px; }

      .data-detail-row > td {
        width: auto;
        white-space: normal;
      }

      .inline-detail-grid,
      .record-detail-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }

      .detail-item { padding: 8px; }

      .mini-table {
        table-layout: fixed;
      }

      .mini-table th,
      .mini-table td {
        padding: 8px 6px;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .mini-table th:nth-child(n+4),
      .mini-table td:nth-child(n+4) {
        display: none;
      }

      .row-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }

      .row-actions .btn {
        width: 100%;
        min-width: 0;
      }

      .row-actions .btn:last-child:nth-child(3) {
        grid-column: 1 / -1;
      }

      .modal-backdrop {
        align-items: end;
        padding: 0;
      }

      .modal {
        width: 100%;
        max-height: calc(100svh - 10px);
        border-radius: 16px 16px 0 0;
      }

      .modal-head, .modal-body { padding: 13px; }

      .modal-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .modal-actions .btn { width: 100%; }
    }

    @media (max-width: 640px) {
      .login-screen {
        align-items: end;
        padding: 74px 14px 18px;
        background-position: 62% center;
        background-image:

      }
      .login-shell { grid-template-columns: 1fr; }
      .login-card {

        padding: 20px;
        border-radius: 18px;

      .login-card .brand-block { margin-bottom: 17px; }
      .login-heading { margin-bottom: 14px; }
      .login-heading h1 { font-size: 25px; }
      .form-grid.two { grid-template-columns: 1fr; }
      .topbar { padding: 9px 11px; }
      .topbar .logo { width: 36px; height: 36px; font-size: 12px; }
      .topbar-actions { gap: 6px; }
      .topbar .theme-toggle {
        width: 36px;
        min-width: 36px;
        padding: 0;
      }
      .topbar .theme-toggle span {
        width: 0;
        overflow: hidden;
        font-size: 0;
      }
      .topbar .theme-toggle::before {
        content: '◐';
        font-size: 17px;
      }
      .status { display: none; }
      h1 { font-size: clamp(24px, 8vw, 28px); }
      .fab {
        width: 54px;
        height: 54px;
        right: max(13px, env(safe-area-inset-right));
        bottom: max(13px, env(safe-area-inset-bottom));
      }
    }

    @media (max-width: 390px) {
      .topbar .brand-block > div:last-child { display: none; }
      .topbar { gap: 6px; }
      .topbar-left, .topbar-actions { gap: 6px; }
      .btn { padding-inline: 11px; }
      .login-card { padding: 17px; }
      .login-card .card-theme + .brand-block { padding-right: 96px; }
      .inline-detail-grid,
      .record-detail-grid { grid-template-columns: 1fr; }
      .detail-item.full { grid-column: auto; }
      .employee-account-grid { grid-template-columns: 1fr; }
      .employee-action strong { font-size: 13px; }
      .employee-action span { font-size: 10px; }
    }

    @media (max-width: 330px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .tabs { grid-template-columns: 1fr; }
    }
  </style>
</head>

    async function boot() {
      applyTheme();
      unregisterOldServiceWorker();
      routeFromHash();
      if (!state.config.ready) {
        renderSetup();
        return;
      }

      supabase = createClient(state.config.url, state.config.key, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
        },
      });

      supabase.auth.onAuthStateChange(async (_event, session) => {
        const previousUserId = state.user?.id || null;
        const nextUserId = session?.user?.id || null;
        state.session = session;
        state.user = session?.user || null;
        state.cache = {};
        if (previousUserId !== nextUserId) resetEmployeeWorkspace();
        if (session) await loadProfile();
        render();
      });

      const { data } = await supabase.auth.getSession();
      state.session = data.session;
      state.user = data.session?.user || null;
      if (state.session) await loadProfile();
      render();
    }

    function resolveConfig() {
      const saved = readJson(localStorage.getItem(CONFIG_STORAGE_KEY)) || {};
      const buildUrl = cleanConfigValue(BUILD_SUPABASE_URL);
      const buildKey = cleanConfigValue(BUILD_SUPABASE_KEY);
      const url = isPlaceholder(buildUrl) ? saved.url : buildUrl;
      const key = isPlaceholder(buildKey) ? saved.key : buildKey;
      return {
        url: String(url || '').trim(),
        key: String(key || '').trim(),
        ready: !isPlaceholder(url) && !isPlaceholder(key) && String(url || '').startsWith('https://') && String(key || '').length > 20,
      };
    }

    function resolveTheme() {
      const saved = localStorage.getItem(THEME_STORAGE_KEY);
      if (saved === 'light' || saved === 'dark') return saved;
      return window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyTheme() {
      document.body.dataset.theme = state.theme;
      const meta = document.querySelector('#theme-color-meta');
      if (meta) meta.setAttribute('content', state.theme === 'dark' ? '#111111' : '#d80c0c');
    }

    function setTheme(theme) {
      state.theme = theme === 'dark' ? 'dark' : 'light';
      localStorage.setItem(THEME_STORAGE_KEY, state.theme);
      applyTheme();
      document.querySelectorAll('[data-theme-label]').forEach(node => {
        node.textContent = themeLabel();
      });
      document.querySelectorAll('[data-theme-set]').forEach(node => {
        node.classList.toggle('active', node.dataset.themeSet === state.theme);
      });
    }

    function toggleTheme() {
      setTheme(state.theme === 'dark' ? 'light' : 'dark');
    }

    function themeLabel() {
      return state.theme === 'dark' ? 'Tema gelap' : 'Tema terang';
    }

    function themeToggleHtml() {
      return `<button class="theme-toggle" type="button" data-action="toggle-theme" title="Ganti tema"><span data-theme-label>${themeLabel()}</span></button>`;
    }

    function cleanConfigValue(value) {
      return String(value || '').trim();
    }

    function isPlaceholder(value) {
      return !value || /^__.+__$/.test(String(value));
    }

    async function renderEmployeePage() {
      const page = document.querySelector('#employee-page');
      if (!page) return;
      page.innerHTML = '<div class="skeleton" style="min-height:180px"></div>';
      try {
        await loadEmployeeWorkspace();
        if (!state.employee) {
          page.innerHTML = '<div class="empty"><strong>Data karyawan belum terhubung.</strong><br>Hubungi owner untuk memeriksa profil karyawan.</div>';
          return;
        }
        if (!state.employee.active) {
          page.innerHTML = '<div class="empty"><strong>Akun karyawan tidak aktif.</strong><br>Hubungi owner untuk mengaktifkan kembali akun.</div>';
          return;
        }
        if (state.employeeRoute === 'operations') {
          page.innerHTML = renderEmployeeOperations();
          return;
        }
        if (state.employeeRoute === 'close') {
          page.innerHTML = renderEmployeeCloseShift();
          return;
        }
        if (state.employeeRoute === 'account') {
          await loadEmployeeHistory();
          page.innerHTML = renderEmployeeAccount();
          return;
        }
        page.innerHTML = await renderEmployeeHome();
      } catch (error) {
        page.innerHTML = `<div class="empty"><strong>Halaman karyawan belum bisa dimuat.</strong><br>${esc(error.message || error)}</div>`;
        toast(error.message || 'Data karyawan gagal dimuat.', 'error');

    }

    async function loadEmployeeWorkspace({ forceShift = false } = {}) {
      if (!state.employeeLoaded) {
        const { data: employee, error } = await supabase
          .from('employees')
          .select('*, default_outlet:outlets(*)')
          .eq('user_id', state.profile.id)
          .maybeSingle();
        if (error) throw error;

        const employeeId = employee?.id || '00000000-0000-0000-0000-000000000000';
        const [assignmentResult, outletResult] = await Promise.all([
          supabase
            .from('outlet_assignments')
            .select('*, outlets(*)')
            .eq('employee_id', employeeId)
            .eq('active', true),
          supabase
            .from('outlets')
            .select('*')
            .eq('active', true)
            .order('name'),
        ]);
        if (assignmentResult.error) throw assignmentResult.error;
        if (outletResult.error) throw outletResult.error;

        state.employee = employee;
        state.employeeAssignments = assignmentResult.data || [];
        state.employeeOutlets = outletResult.data || [];
        state.employeeLoaded = true;
      }

      if (state.employee && (!state.employeeShiftLoaded || forceShift)) {
        const { data, error } = await supabase
          .from('shifts')
          .select('*, outlets(*)')
          .eq('employee_id', state.employee.id)
          .in('status', ['draft', 'active', 'final_reported'])
          .order('created_at', { ascending: false })
          .limit(1)
          .maybeSingle();
        if (error) throw error;
        state.employeeShift = data || null;
        state.employeeShiftLoaded = true;
      }

      const outletId = state.employeeShift?.outlet_id || state.employee?.default_outlet_id;
      if (outletId && state.employeeProductsFor !== outletId) {
        await loadEmployeeProducts(outletId);
      }
    }

    async function loadEmployeeProducts(outletId) {
      const [productResult, priceResult] = await Promise.all([
        supabase
          .from('products')
          .select('*, product_categories(name)')
          .eq('active', true)
          .order('name'),
        supabase
          .from('outlet_product_prices')
          .select('product_id, sale_price, valid_from')
          .eq('outlet_id', outletId)
          .eq('active', true)
          .order('valid_from', { ascending: false }),
      ]);
      if (productResult.error) throw productResult.error;
      if (priceResult.error) throw priceResult.error;

      const latestPrices = new Map();
      (priceResult.data || []).forEach(price => {
        if (!latestPrices.has(price.product_id)) latestPrices.set(price.product_id, price.sale_price);
      });
      state.employeeProducts = (productResult.data || []).map(product => ({
        ...product,
        resolved_price: latestPrices.get(product.id) ?? product.general_sale_price,
      }));
      state.employeeProductsFor = outletId;
    }

    async function loadEmployeeHistory() {
      const { data, error } = await supabase
        .from('shifts')
        .select('*, outlets(name)')
        .eq('employee_id', state.employee.id)
        .order('created_at', { ascending: false })
        .limit(20);
      if (error) throw error;
      state.employeeHistory = data || [];
    }

    async function loadEmployeeShiftSummary(shiftId) {
      const [saleResult, expenseResult, reportResult] = await Promise.all([
        supabase.from('sales').select('id, payment_method, total_amount, occurred_at').eq('shift_id', shiftId),
        supabase.from('outlet_expenses').select('id, amount, occurred_at').eq('shift_id', shiftId),
        supabase.from('periodic_reports').select('reported_at').eq('shift_id', shiftId).order('reported_at', { ascending: false }).limit(1).maybeSingle(),
      ]);
      if (saleResult.error) throw saleResult.error;
      if (expenseResult.error) throw expenseResult.error;
      if (reportResult.error) throw reportResult.error;
      const sales = saleResult.data || [];
      const expenses = expenseResult.data || [];
      return {
        salesTotal: sales.reduce((total, row) => total + Number(row.total_amount || 0), 0),
        transactionCount: sales.length,
        expenseTotal: expenses.reduce((total, row) => total + Number(row.amount || 0), 0),
        lastReportAt: reportResult.data?.reported_at || null,
      };
    }

    async function renderOwnerPage() {
      const page = document.querySelector('#page');
      if (!page) return;
      document.body.classList.remove('drawer-open');
      if (state.route === 'dashboard') {
        page.innerHTML = dashboardSkeleton();
        await renderDashboard();
        return;
      }
      if (state.route === 'settings') {
        renderSettingsPage(page);
        return;
      }
      if (state.route === 'detail') {
        await renderDetailPage(page);
        return;
      }
      const config = tableConfigs[state.route] || tableConfigs.employees;
      page.innerHTML = pageSkeleton(config);
      try {
        const rows = await config.load();
        state.cache[state.route] = rows;
        page.innerHTML = tablePageHtml(state.route, config, rows);
      } catch (error) {

    function tablePageHtml(key, config, rows) {
      return `
        <div class="page-head">
          <div>
            <p class="eyebrow">${esc(config.eyebrow)}</p>
            <h1>${esc(config.title)}</h1>
            <p class="page-desc">${esc(config.desc)}</p>
          </div>

    function dataTableHtml(key, config, rows) {
      const listColumns = getListColumns(config);
      return `
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                ${listColumns.map(column => `<th>${esc(column.label)}</th>`).join('')}

              </tr>
            </thead>
            <tbody>
              ${rows.map(row => dataRowsHtml(key, config, row, listColumns)).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function dataRowsHtml(key, config, row, listColumns) {
      const rowId = String(row.id);
      const detailId = `detail-${key}-${rowId}`;
      return `
        <tr class="data-row" tabindex="0" data-row-key="${esc(rowId)}" data-resource="${esc(key)}" aria-expanded="false" aria-controls="${esc(detailId)}">
          ${listColumns.map(column => `<td title="${esc(plainCellText(column.value(row)))}">${safeCell(column.value(row))}</td>`).join('')}

          </td>
        </tr>
        <tr class="data-detail-row" id="${esc(detailId)}" data-detail-key="${esc(rowId)}" data-resource="${esc(key)}" hidden>
          <td colspan="${listColumns.length + 1}">${inlineDetailsHtml(key, config, row, listColumns)}</td>
        </tr>`;
    }

    function getListColumns(config) {
      const labels = new Set(config.listColumns || config.columns.slice(0, 3).map(column => column.label));
      return config.columns.filter(column => labels.has(column.label));
    }

    function inlineDetailsHtml(key, config, row, listColumns) {
      const shownLabels = new Set(listColumns.map(column => column.label));
      const details = config.columns.filter(column => !shownLabels.has(column.label));
      return `
        <div class="inline-detail">
          ${details.length ? `<div class="inline-detail-grid">${details.map(field => detailItemHtml(field, row)).join('')}</div>` : '<p class="page-desc">Tidak ada informasi tambahan.</p>'}
          <div class="detail-actions">
            ${config.detailPage ? `<button class="btn primary small" type="button" data-view-detail="${esc(key)}" data-id="${esc(row.id)}">Lihat data lengkap</button>` : ''}
            ${config.readonly ? '' : rowActionsHtml(key, row)}
          </div>
        </div>`;
    }

    async function renderDetailPage(page) {
      const context = state.detailContext;
      const config = context ? tableConfigs[context.resourceKey] : null;
      if (!config || !config.detailPage) {
        state.route = 'dashboard';
        history.replaceState(null, '', '#/dashboard');
        await renderOwnerPage();
        return;
      }

      page.innerHTML = pageSkeleton({
        eyebrow: 'Detail data',
        title: config.title,
        desc: 'Memuat informasi lengkap...',
      });

      try {
        let row;
        if (config.loadDetail) {
          row = await config.loadDetail(context.rowId);
          const cachedRows = Array.isArray(state.cache[context.resourceKey]) ? state.cache[context.resourceKey] : [];
          if (!cachedRows.some(item => String(item.id) === String(row?.id))) {
            state.cache[context.resourceKey] = [...cachedRows, row];
          }
        } else {
          let rows = state.cache[context.resourceKey];
          if (!Array.isArray(rows)) {
            rows = await config.load();
            state.cache[context.resourceKey] = rows;
          }
          row = rows.find(item => String(item.id) === String(context.rowId));
        }
        if (!row) throw new Error('Data tidak ditemukan atau sudah dihapus.');
        page.innerHTML = detailPageHtml(context.resourceKey, config, row);
      } catch (error) {
        page.innerHTML = `
          <button class="btn ghost small" type="button" data-route="${esc(context.resourceKey)}">← Kembali</button>
          <div class="empty" style="margin-top:12px"><strong>Detail belum bisa dimuat.</strong><br>${esc(error.message || error)}</div>`;
      }
    }

    function detailPageHtml(key, config, row) {
      const fields = config.detailFields || config.columns;
      return `
        <div class="page-head">
          <div>
            <p class="eyebrow">Detail data</p>
            <h1>${esc(config.title)}</h1>
            <p class="page-desc">Informasi lengkap untuk data yang dipilih.</p>
          </div>
          <button class="btn ghost small" type="button" data-route="${esc(key)}">← Kembali</button>
        </div>
        <div class="panel detail-panel">
          <div class="record-detail-grid">
            ${fields.map(field => detailItemHtml(field, row)).join('')}
          </div>
          ${typeof config.detailExtra === 'function' ? config.detailExtra(row) : ''}

      return `

    function toggleDataRow(key, rowId) {
      const row = document.querySelector(`.data-row[data-resource="${cssEscape(key)}"][data-row-key="${cssEscape(rowId)}"]`);
      const detail = document.querySelector(`.data-detail-row[data-resource="${cssEscape(key)}"][data-detail-key="${cssEscape(rowId)}"]`);
      if (!row || !detail) return;
      const willOpen = detail.hidden;
      document.querySelectorAll('.data-detail-row:not([hidden])').forEach(item => {
        item.hidden = true;
      });
      document.querySelectorAll('.data-row.is-open').forEach(item => {
        item.classList.remove('is-open');
        item.setAttribute('aria-expanded', 'false');
      });
      detail.hidden = !willOpen;
      row.classList.toggle('is-open', willOpen);
      row.setAttribute('aria-expanded', String(willOpen));
    }

      const { data: userResult, error: userError } = await supabase.auth.getUser();
      if (userError) throw userError;
      state.user = userResult.user;
      if (!state.user) {
        state.profile = null;
        return;
      }

        .select('*')
        .eq('id', state.user.id)

    async function loadEmployees() {

    async function loadActiveOutlets() {
      if (state.cache.activeOutlets) return state.cache.activeOutlets;
      const { data, error } = await supabase
        .from('outlets')
        .select('*')
        .eq('active', true)
        .order('name');
      if (error) throw error;
      state.cache.activeOutlets = data || [];
      return data || [];
    }

    async function loadProductsAll() {
      const { data, error } = await supabase
        .from('products')
        .select('*, product_categories(name)')
        .order('name');
      if (error) throw error;
      const products = await attachLatestCosts(data || []);
      state.cache.products = products;
      return products;
    }

    async function loadActiveProducts() {
      if (state.cache.activeProducts) return state.cache.activeProducts;
      const { data, error } = await supabase
        .from('products')
        .select('*')
        .eq('active', true)
        .order('name');
      if (error) throw error;
      state.cache.activeProducts = data || [];
      return data || [];
    }

    async function attachLatestCosts(products) {
      if (!products.length) return products;
      const { data, error } = await supabase
        .from('product_costs')
        .select('product_id, hpp, valid_from')
        .in('product_id', products.map(product => product.id))
        .order('valid_from', { ascending: false });
      if (error) throw error;
      const latest = new Map();
      (data || []).forEach(row => {
        if (!latest.has(row.product_id)) latest.set(row.product_id, row.hpp);
      });
      return products.map(product => ({ ...product, hpp: latest.get(product.id) ?? 0 }));
    }

    async function loadOutletPrices() {
      const { data, error } = await supabase
        .from('outlet_product_prices')
        .select('*, outlets(id, name), products(id, name)')
        .eq('active', true)
        .order('valid_from', { ascending: false });
      if (error) throw error;
      return data || [];
    }

        .select('*')

        .order('created_at', { ascending: false });

    async function loadPayrollPeriods() {

    async function loadActiveShifts() {

    async function loadLatestLocations() {
      const { data, error } = await supabase

        .order('created_at', { ascending: false })

    async function loadAuditLogs() {
      const { data, error } = await supabase
        .from('audit_logs')
        .select('id, table_name, action, record_id, reason, created_at, actor_id')
        .order('created_at', { ascending: false })
        .limit(60);
      if (error) throw error;
      return data || [];
    }

    async function loadAuditLogDetail(rowId) {
      const { data, error } = await supabase
        .from('audit_logs')
        .select('*')
        .eq('id', rowId)
        .single();
      if (error) throw error;
      return data;
    }

    async function loadProductPerformance(range) {
      const { data, error } = await supabase
        .from('sale_items')
        .select('qty, subtotal, products(name), sales!inner(occurred_at)')
        .gte('sales.occurred_at', range.start)
        .lt('sales.occurred_at', range.end);
      if (error) throw error;
      const map = new Map();
      (data || []).forEach(row => {
        const name = row.products?.name || 'Produk';
        const current = map.get(name) || { name, qty: 0, amount: 0 };
        current.qty += Number(row.qty || 0);
        current.amount += Number(row.subtotal || 0);
        map.set(name, current);
      });
      return [...map.values()].sort((a, b) => b.amount - a.amount).slice(0, 8);
    }

    async function loadTopOutlets(range) {
      const { data, error } = await supabase
        .from('sales')
        .select('total_amount, outlets(name), occurred_at')
        .gte('occurred_at', range.start)
        .lt('occurred_at', range.end);
      if (error) throw error;
      const map = new Map();
      (data || []).forEach(row => {
        const name = row.outlets?.name || 'Outlet';
        const current = map.get(name) || { name, amount: 0 };
        current.amount += Number(row.total_amount || 0);
        map.set(name, current);
      });
      return [...map.values()].sort((a, b) => b.amount - a.amount).slice(0, 8);
    }

    function fieldHtml(field, row) {
      if (field.type === 'location-map') return outletLocationPickerHtml(row);
      const rawValue = fieldValue(field, row);
      const required = field.required ? 'required' : '';
      const full = field.full || field.type === 'textarea' ? ' full' : '';
      const attrs = [
        required,
        field.step ? `step="${esc(field.step)}"` : '',
        field.inputmode ? `inputmode="${esc(field.inputmode)}"` : '',
        field.maxlength ? `maxlength="${esc(field.maxlength)}"` : '',
        field.pattern ? `pattern="${esc(field.pattern)}"` : '',
        field.placeholder ? `placeholder="${esc(field.placeholder)}"` : '',
      ].filter(Boolean).join(' ');

      if (field.type === 'select') {
        const options = typeof field.options === 'function' ? field.options() : field.options;
        return `
          <div class="field${full}">
            <label>${esc(field.label)}</label>
            <select name="${esc(field.name)}" ${required}>
              ${options.map(option => `<option value="${esc(option.value)}" ${String(option.value) === String(rawValue) ? 'selected' : ''}>${esc(option.label)}</option>`).join('')}
            </select>
          </div>`;
      }

      if (field.type === 'textarea') {
        return `
          <div class="field${full}">
            <label>${esc(field.label)}</label>
            <textarea name="${esc(field.name)}" ${attrs}>${esc(rawValue)}</textarea>
          </div>`;
      }

      return `
        <div class="field${full}">
          <label>${esc(field.label)}</label>
          <input name="${esc(field.name)}" type="${esc(field.type || 'text')}" value="${esc(rawValue)}" ${attrs}>
        </div>`;
    }

              const coordinate = outletPointFromRow(row, point.key);
              return `
                <div class="location-coordinate-item">
                  <strong>${esc(point.label)}</strong>
                  <span data-outlet-coordinate="${esc(point.key)}">${coordinate ? esc(formatPickerCoordinate(coordinate.lat, coordinate.lng)) : 'Belum dipilih'}</span>
                </div>`;
            }).join('')}
          </div>
          ${outletLocationPoints.map(point => {
            const coordinate = outletPointFromRow(row, point.key);
            return `
              <input type="hidden" name="${esc(point.key)}_lat" value="${coordinate ? esc(coordinate.lat) : ''}">
              <input type="hidden" name="${esc(point.key)}_lng" value="${coordinate ? esc(coordinate.lng) : ''}">`;
          }).join('')}
        </div>`;
    }

    function outletLocationPointDefinition(kind) {
      return outletLocationPoints.find(point => point.key === kind) || outletLocationPoints[0];
    }

    function outletPointFromRow(row, kind) {
      const rawLat = row?.[`${kind}_lat`];
      const rawLng = row?.[`${kind}_lng`];
      if (rawLat === null || rawLat === undefined || rawLat === '' || rawLng === null || rawLng === undefined || rawLng === '') return null;
      const lat = Number(rawLat);
      const lng = Number(rawLng);
      return validMapCoordinate(lat, lng) ? { lat, lng } : null;
    }

    function validMapCoordinate(lat, lng) {
      if (lat === null || lat === undefined || lat === '' || lng === null || lng === undefined || lng === '') return false;
      return Number.isFinite(Number(lat))
        && Number.isFinite(Number(lng))
        && Number(lat) >= -90
        && Number(lat) <= 90
        && Number(lng) >= -180
        && Number(lng) <= 180
        && !(Number(lat) === 0 && Number(lng) === 0);
    }

    function formatPickerCoordinate(lat, lng) {
      return `${Number(lat).toFixed(7)}, ${Number(lng).toFixed(7)}`;
    }

    function ensureLeaflet() {
      if (window.L) return Promise.resolve(window.L);
      if (leafletLoaderPromise) return leafletLoaderPromise;

      const cssId = 'leaflet-stylesheet';
      if (!document.querySelector(`#${cssId}`)) {
        const stylesheet = document.createElement('link');
        stylesheet.id = cssId;
        stylesheet.rel = 'stylesheet';
        stylesheet.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
        stylesheet.integrity = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';
        stylesheet.crossOrigin = 'anonymous';
        document.head.append(stylesheet);
      }

      const loader = new Promise((resolve, reject) => {
        const existingScript = document.querySelector('#leaflet-script');
        const script = existingScript || document.createElement('script');
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          window.L ? resolve(window.L) : reject(new Error('Pustaka peta gagal dimuat.'));
        };
        const fail = () => {
          if (settled) return;
          settled = true;
          reject(new Error('Peta tidak dapat dimuat. Periksa koneksi internet.'));
        };
        script.addEventListener('load', finish, { once: true });
        script.addEventListener('error', fail, { once: true });
        if (!existingScript) {
          script.id = 'leaflet-script';
          script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
          script.integrity = 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';
          script.crossOrigin = 'anonymous';
          document.head.append(script);
        } else if (window.L) {
          finish();
        }
        setTimeout(fail, 15000);
      });

      leafletLoaderPromise = loader.catch(error => {
        leafletLoaderPromise = null;
        throw error;
      });
      return leafletLoaderPromise;
    }

    async function initOutletLocationMap() {
      destroyOutletLocationMap();
      const mapElement = document.querySelector('#outlet-location-map');
      if (!mapElement) return;
      try {
        const L = await ensureLeaflet();
        if (!mapElement.isConnected) return;
        mapElement.innerHTML = '';
        outletLocationMap = L.map(mapElement, { zoomControl: true });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap',
        }).addTo(outletLocationMap);
        outletLocationMap.on('click', event => {
          setOutletLocationPoint(activeOutletLocationPoint, event.latlng.lat, event.latlng.lng);
        });

        const coordinates = outletLocationPoints
          .map(point => ({ point, coordinate: outletPointFromForm(point.key) }))
          .filter(item => item.coordinate);
        coordinates.forEach(({ point, coordinate }) => {
          drawOutletLocationMarker(point.key, coordinate.lat, coordinate.lng);
        });

        if (coordinates.length) {
          const bounds = L.latLngBounds(coordinates.map(item => [item.coordinate.lat, item.coordinate.lng]));
          outletLocationMap.fitBounds(bounds, { padding: [28, 28], maxZoom: 16 });
        } else {
          outletLocationMap.setView([-2.5, 118], 5);
        }
        requestAnimationFrame(() => outletLocationMap?.invalidateSize());
      } catch (error) {
        mapElement.innerHTML = `<div class="map-error">${esc(error.message || 'Peta gagal dimuat.')}<br>Gunakan tombol Lokasi Anda dan izinkan akses GPS.</div>`;
      }
    }

    function outletPointFromForm(kind) {
      const latInput = document.querySelector(`[name="${kind}_lat"]`);
      const lngInput = document.querySelector(`[name="${kind}_lng"]`);
      if (!latInput || !lngInput || latInput.value === '' || lngInput.value === '') return null;
      const lat = Number(latInput.value);
      const lng = Number(lngInput.value);
      return validMapCoordinate(lat, lng) ? { lat, lng } : null;
    }

    function selectOutletLocationPoint(kind, panToPoint = true) {
      activeOutletLocationPoint = outletLocationPointDefinition(kind).key;
      document.querySelectorAll('[data-outlet-map-point]').forEach(button => {
        button.classList.toggle('active', button.dataset.outletMapPoint === activeOutletLocationPoint);
      });
      const definition = outletLocationPointDefinition(activeOutletLocationPoint);
      const status = document.querySelector('[data-location-map-status]');
      if (status) status.textContent = `${definition.description} sedang dipilih. Sentuh peta untuk menentukan titik.`;
      const coordinate = outletPointFromForm(activeOutletLocationPoint);
      if (panToPoint && coordinate && outletLocationMap) {
        outletLocationMap.setView([coordinate.lat, coordinate.lng], Math.max(outletLocationMap.getZoom(), 16));
      }
    }

    function setOutletLocationPoint(kind, lat, lng, options = {}) {
      if (!validMapCoordinate(lat, lng)) return;
      const safeKind = outletLocationPointDefinition(kind).key;
      const latitude = Number(lat);
      const longitude = Number(lng);
      const latInput = document.querySelector(`[name="${safeKind}_lat"]`);
      const lngInput = document.querySelector(`[name="${safeKind}_lng"]`);
      if (!latInput || !lngInput) return;
      latInput.value = latitude.toFixed(7);
      lngInput.value = longitude.toFixed(7);
      const coordinateTextElement = document.querySelector(`[data-outlet-coordinate="${safeKind}"]`);
      if (coordinateTextElement) coordinateTextElement.textContent = formatPickerCoordinate(latitude, longitude);
      const tab = document.querySelector(`[data-outlet-map-point="${safeKind}"]`);
      tab?.classList.add('is-set');
      drawOutletLocationMarker(safeKind, latitude, longitude);
      selectOutletLocationPoint(safeKind, false);
      if (options.center && outletLocationMap) outletLocationMap.setView([latitude, longitude], 17);
    }

    function drawOutletLocationMarker(kind, lat, lng) {
      if (!outletLocationMap || !window.L) return;
      const definition = outletLocationPointDefinition(kind);
      const existing = outletLocationMarkers[kind];
      if (existing) {
        existing.setLatLng([lat, lng]);
        return;
      }
      outletLocationMarkers[kind] = window.L.circleMarker([lat, lng], {
        radius: 9,
        color: '#ffffff',
        weight: 3,
        fillColor: definition.color,
        fillOpacity: 1,
        bubblingMouseEvents: false,
      })
        .addTo(outletLocationMap)
        .bindTooltip(definition.label);
      outletLocationMarkers[kind].on('click', () => selectOutletLocationPoint(kind, false));
    }

    async function useCurrentOutletLocation(button) {
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = 'Membaca GPS…';
      try {
        const location = await getDeviceLocation({ maximumAge: 0 });
        setOutletLocationPoint(activeOutletLocationPoint, location.lat, location.lng, { center: true });
        if (outletLocationMap && window.L) {
          outletLocationAccuracyCircle?.remove();
          outletLocationAccuracyCircle = window.L.circle([location.lat, location.lng], {
            radius: Math.max(5, Number(location.accuracy || 0)),
            color: '#2563eb',
            weight: 1,
            fillColor: '#60a5fa',
            fillOpacity: .13,
          }).addTo(outletLocationMap);
        }
        toast(`${outletLocationPointDefinition(activeOutletLocationPoint).label} diarahkan ke lokasi Anda.`, 'success');
      } catch (error) {
        toast(error.message || 'Lokasi Anda gagal dibaca.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    function destroyOutletLocationMap() {
      outletLocationAccuracyCircle = null;
      outletLocationMarkers = {};
      if (outletLocationMap) {
        outletLocationMap.remove();
        outletLocationMap = null;
      }
    }

    function fieldValue(field, row) {
      if (row && typeof field.value === 'function') return field.value(row) ?? '';
      if (row && row[field.name] !== undefined && row[field.name] !== null) {
        if (typeof row[field.name] === 'boolean') return String(row[field.name]);
        return row[field.name];
      }
      return field.defaultValue ?? '';
    }

    async function saveResource(form) {
      const context = state.formContext;
      if (!context) return;
      const config = tableConfigs[context.resourceKey];
      const row = context.id ? (state.cache[context.resourceKey] || []).find(item => String(item.id) === String(context.id)) : null;
      const fields = config.fields().filter(field => !(field.createOnly && row) && !(field.editOnly && !row));
      const values = formValues(form, fields);
      if (context.resourceKey === 'outlets') {
        const missingPoints = outletLocationPoints.filter(point => !validMapCoordinate(values[`${point.key}_lat`], values[`${point.key}_lng`]));
        if (missingPoints.length) {
          toast(`Tentukan titik ${missingPoints.map(point => point.label).join(', ')} melalui peta.`, 'error');
          return;
        }
      }
      disableForm(form, true);
      try {
        await persistResource(context.resourceKey, values, row);
        closeModal();
        state.cache = {};
        toast('Data berhasil disimpan.', 'success');
        await renderOwnerPage();
      } catch (error) {
        toast(error.message || 'Data gagal disimpan.', 'error');
      } finally {
        disableForm(form, false);
      }
    }

    function formValues(form, fields) {
      const data = new FormData(form);
      const values = {};
      fields.forEach(field => {
        if (field.type === 'location-map') {
          outletLocationPoints.forEach(point => {
            const rawLat = data.get(`${point.key}_lat`);
            const rawLng = data.get(`${point.key}_lng`);
            values[`${point.key}_lat`] = rawLat === '' || rawLat == null ? null : Number(rawLat);
            values[`${point.key}_lng`] = rawLng === '' || rawLng == null ? null : Number(rawLng);
          });
          return;
        }
        let value = data.get(field.name);
        if (field.type === 'number') value = value === '' || value == null ? null : Number(value);
        if (field.type === 'select' && ['active'].includes(field.name)) value = value === 'true';
        if (typeof value === 'string') value = value.trim();
        if (value === '') value = null;
        values[field.name] = value;
      });
      return values;
    }

    async function persistResource(resourceKey, values, row) {
      if (resourceKey === 'employees') return saveEmployee(values, row);
      if (resourceKey === 'outlets') return upsert('outlets', values, row);
      if (resourceKey === 'products') return saveProduct(values, row);
      if (resourceKey === 'prices') return saveOutletPrice(values, row);
      if (resourceKey === 'expenses') return upsert('general_expenses', values, row, { created_by: state.profile.id });
      if (resourceKey === 'payroll') return upsert('payroll_periods', values, row, { created_by: state.profile.id });
      throw new Error('Resource tidak dikenal.');
    }

    async function saveEmployee(values, row) {
      if (!row) {
        const pin = String(values.pin || '').trim();
        if (!/^[0-9]{6}$/.test(pin)) throw new Error('PIN awal harus 6 digit.');
        return adminFunction('admin-create-employee', {
          full_name: values.full_name,
          employee_code: values.employee_code,
          phone: values.phone,
          pin,
          default_outlet_id: values.default_outlet_id || null,
          hourly_rate: values.hourly_rate ?? 5000,
          meal_allowance: values.meal_allowance ?? 10000,
          transport_allowance: values.transport_allowance ?? 0,
        });
      }

      const profileUpdate = cleanObject({
        full_name: values.full_name,
        employee_code: values.employee_code,
        phone: values.phone,
        active: values.active,
      });
      const employeeUpdate = cleanObject({
        employee_code: values.employee_code,
        phone: values.phone,
        default_outlet_id: values.default_outlet_id || null,
        hourly_rate: values.hourly_rate,
        meal_allowance: values.meal_allowance,
        transport_allowance: values.transport_allowance,
        active: values.active,
      });
      const { error: profileError } = await supabase.from('user_profiles').update(profileUpdate).eq('id', row.user_id);
      if (profileError) throw profileError;
      const { error } = await supabase.from('employees').update(employeeUpdate).eq('id', row.id);
      if (error) throw error;
    }

    async function saveProduct(values, row) {
      const { hpp, ...productValues } = values;
      const payload = cleanObject(productValues);
      const query = row
        ? supabase.from('products').update(payload).eq('id', row.id).select().single()
        : supabase.from('products').insert({ ...payload, tenant_id: state.profile.tenant_id }).select().single();
      const { data, error } = await query;
      if (error) throw error;
      if (hpp !== null && hpp !== undefined) {
        const { error: hppError } = await supabase.from('product_costs').insert({
          tenant_id: state.profile.tenant_id,
          product_id: data.id,
          hpp,
          created_by: state.profile.id,
        });
        if (hppError) throw hppError;
      }
      return data;
    }

    async function saveOutletPrice(values, row) {
      const payload = cleanObject(values);
      const query = row
        ? supabase.from('outlet_product_prices').update({ sale_price: payload.sale_price }).eq('id', row.id)
        : supabase.from('outlet_product_prices').insert({ ...payload, tenant_id: state.profile.tenant_id, created_by: state.profile.id });
      const { error } = await query;
      if (error) throw error;
    }

    async function upsert(table, values, row, extraInsert = {}) {
      const payload = cleanObject(values);
      const query = row
        ? supabase.from(table).update(payload).eq('id', row.id)
        : supabase.from(table).insert({ ...payload, ...extraInsert, tenant_id: state.profile.tenant_id });
      const { error } = await query;
      if (error) throw error;
    }

    async function deleteResource(resourceKey, id) {
      const config = tableConfigs[resourceKey];
      const row = (state.cache[resourceKey] || []).find(item => String(item.id) === String(id));
      if (!row || !config || config.readonly) return;
      openModal(`Hapus ${config.title}`, `
        <p>Yakin hapus data ini? Untuk master data, status akan dibuat nonaktif supaya riwayat lama tetap aman.</p>
        <div class="modal-actions">
          <button class="btn ghost" type="button" data-action="close-modal">Batal</button>
          <button class="btn danger" type="button" data-confirm-delete="${esc(resourceKey)}" data-id="${esc(id)}">Hapus</button>
        </div>
      `);
    }

    async function confirmDelete(resourceKey, id) {
      const row = (state.cache[resourceKey] || []).find(item => String(item.id) === String(id));
      try {
        if (resourceKey === 'employees') {
          const profileResult = await supabase.from('user_profiles').update({ active: false }).eq('id', row.user_id);
          if (profileResult.error) throw profileResult.error;
          const employeeResult = await supabase.from('employees').update({ active: false }).eq('id', id);
          if (employeeResult.error) throw employeeResult.error;
        } else if (['outlets', 'products', 'prices'].includes(resourceKey)) {
          const table = resourceKey === 'prices' ? 'outlet_product_prices' : resourceKey;
          const result = await supabase.from(table).update({ active: false }).eq('id', id);
          if (result.error) throw result.error;
        } else if (resourceKey === 'expenses') {
          const result = await supabase.from('general_expenses').delete().eq('id', id);
          if (result.error) throw result.error;
        } else if (resourceKey === 'payroll') {
          const result = await supabase.from('payroll_periods').delete().eq('id', id);
          if (result.error) throw result.error;
        }
        closeModal();
        state.cache = {};
        state.detailContext = null;
        state.route = resourceKey;
        history.replaceState(null, '', `#/${resourceKey}`);
        toast('Data berhasil dihapus.', 'success');
        await renderOwnerPage();
      } catch (error) {
        toast(error.message || 'Data gagal dihapus.', 'error');
      }
    }

    async function openResetPin(userId, rowId) {
      const row = (state.cache.employees || []).find(item => String(item.id) === String(rowId));
      state.formContext = { userId };
      openModal('Reset PIN karyawan', `
        <p class="page-desc">Karyawan: ${esc(row?.user_profiles?.full_name || row?.employee_code || '-')}</p>
        <form class="form-grid" data-submit="reset-pin">
          <div class="field">
            <label>PIN baru</label>
            <input name="new_pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required>
          </div>
          <div class="modal-actions">
            <button class="btn ghost" type="button" data-action="close-modal">Batal</button>
            <button class="btn primary" type="submit">Reset PIN</button>
          </div>
        </form>
      `);
    }

    async function resetPin(form) {
      const values = new FormData(form);
      const newPin = String(values.get('new_pin') || '').trim();
      if (!/^[0-9]{6}$/.test(newPin)) {
        toast('PIN baru harus 6 digit.', 'error');
        return;
      }
      disableForm(form, true);
      try {
        await adminFunction('admin-reset-pin', {
          user_id: state.formContext.userId,
          new_pin: newPin,
        });
        closeModal();
        toast('PIN karyawan berhasil direset.', 'success');
      } catch (error) {
        toast(error.message || 'Reset PIN gagal.', 'error');
      } finally {
        disableForm(form, false);
      }
    }

    function employeeSelectedPhoto(values, kind) {
      const inputPhoto = values.get('photo');
      if (inputPhoto instanceof File && inputPhoto.size) return inputPhoto;
      return state.employeePhotos[kind] || null;
    }

    function setEmployeePhoto(kind, file) {
      if (!(file instanceof File) || !file.size || (file.type && !file.type.startsWith('image/'))) {
        toast('File yang dipilih harus berupa foto.', 'error');
        return false;
      }

      const oldPreviewUrl = employeePhotoPreviewUrls.get(kind);
      if (oldPreviewUrl) URL.revokeObjectURL(oldPreviewUrl);
      const previewUrl = URL.createObjectURL(file);
      employeePhotoPreviewUrls.set(kind, previewUrl);
      state.employeePhotos[kind] = file;

      const input = document.querySelector(`[data-photo-input="${kind}"]`);
      if (input && typeof DataTransfer !== 'undefined') {
        try {
          const transfer = new DataTransfer();
          transfer.items.add(file);
          input.files = transfer.files;
        } catch {
          // Safari tertentu tidak mengizinkan pengisian input file. State di atas tetap dipakai.
        }
      }

      const selection = document.querySelector(`[data-photo-selection="${kind}"]`);
      if (selection) {
        selection.classList.add('ready');
        selection.innerHTML = `
          <img src="${esc(previewUrl)}" alt="Preview foto absen">
          <div><strong>Foto siap digunakan</strong><small>${esc(file.name || 'foto-absen.jpg')}</small></div>`;
      }
      return true;
    }

    function clearEmployeePhoto(kind) {
      const previewUrl = employeePhotoPreviewUrls.get(kind);
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      employeePhotoPreviewUrls.delete(kind);
      delete state.employeePhotos[kind];
      const input = document.querySelector(`[data-photo-input="${kind}"]`);
      if (input) input.value = '';
    }

    function clearAllEmployeePhotos() {
      [...employeePhotoPreviewUrls.values()].forEach(url => URL.revokeObjectURL(url));
      employeePhotoPreviewUrls.clear();
      state.employeePhotos = {};
    }

    function cameraModalHtml(kind, content, controls = '') {
      return `
        <div class="modal-backdrop">
          <section class="modal camera-modal" role="dialog" aria-modal="true" aria-label="Kamera foto absen">
            <div class="modal-head">
              <div>
                <h2 class="modal-title">Foto absen</h2>
                <p class="help">Posisikan wajah dengan jelas di dalam kamera.</p>
              </div>
              <button class="btn ghost small" type="button" data-action="close-employee-camera">X</button>
            </div>
            <div class="modal-body">
              ${content}
              ${controls}
              <p class="camera-hint">Foto hanya diunggah saat tombol absen ditekan.</p>
            </div>
          </section>
        </div>`;
    }

    async function openEmployeeCamera(kind) {
      const input = document.querySelector(`[data-photo-input="${kind}"]`);
      if (!input) return;
      if (!navigator.mediaDevices?.getUserMedia) {
        toast('Kamera langsung tidak tersedia. Silakan pilih foto dari galeri.', 'error');
        input.click();
        return;
      }

      stopEmployeeCamera();
      activeCameraKind = kind;
      modalRoot.innerHTML = cameraModalHtml(
        kind,
        '<div class="camera-view"><div class="camera-loading">Membuka kamera…</div><video id="employee-camera-video" autoplay muted playsinline></video></div>',
        `<div class="camera-controls">
          <button class="btn primary" type="button" data-action="capture-employee-photo" data-camera-kind="${esc(kind)}" disabled>Ambil Foto</button>
          <button class="btn ghost" type="button" data-action="choose-employee-photo" data-camera-kind="${esc(kind)}">Pilih Galeri</button>
        </div>`,
      );

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'user' },
            width: { ideal: 1280 },
            height: { ideal: 1280 },
          },
          audio: false,
        });
        if (activeCameraKind !== kind) {
          stream.getTracks().forEach(track => track.stop());
          return;
        }
        activeCameraStream = stream;
        const video = document.querySelector('#employee-camera-video');
        if (!video) throw new Error('Tampilan kamera tidak tersedia.');
        video.srcObject = stream;
        await video.play();
        const loading = video.parentElement?.querySelector('.camera-loading');
        if (loading) loading.remove();
        const captureButton = modalRoot.querySelector('[data-action="capture-employee-photo"]');
        if (captureButton) captureButton.disabled = false;
      } catch (error) {
        const cameraStillOpen = activeCameraKind === kind;
        stopEmployeeCamera();
        if (!cameraStillOpen) return;
        activeCameraKind = kind;
        modalRoot.innerHTML = cameraModalHtml(
          kind,
          `<div class="empty">Kamera tidak dapat dibuka. Pastikan izin kamera aktif, atau gunakan foto dari galeri.<br><small>${esc(error?.message || '')}</small></div>`,
          `<div class="camera-controls">
            <button class="btn primary" type="button" data-action="choose-employee-photo" data-camera-kind="${esc(kind)}">Pilih Galeri</button>
            <button class="btn ghost" type="button" data-action="close-employee-camera">Batal</button>
          </div>`,
        );
      }
    }

    async function captureEmployeePhoto(kind, button) {
      const video = document.querySelector('#employee-camera-video');
      if (!video || !video.videoWidth || !video.videoHeight) {
        toast('Kamera belum siap. Tunggu sebentar lalu coba lagi.', 'error');
        return;
      }

      button.disabled = true;
      try {
        const scale = Math.min(1280 / video.videoWidth, 1280 / video.videoHeight, 1);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
        canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
        const context = canvas.getContext('2d');
        context.translate(canvas.width, 0);
        context.scale(-1, 1);
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve, reject) => canvas.toBlob(
          result => result ? resolve(result) : reject(new Error('Foto gagal dibuat.')),
          'image/jpeg',
          .78,
        ));
        const file = new File([blob], `absen-${kind}-${Date.now()}.jpg`, { type: 'image/jpeg' });
        if (!setEmployeePhoto(kind, file)) return;
        closeEmployeeCamera();
        toast('Foto berhasil dipilih dan siap digunakan.', 'success');

      const { data, error } = await supabase.rpc('expected_stock_for_shift', { target_shift_id: shiftId });

    function employeeQtyItems(values, prefix) {
      return state.employeeProducts
        .map(product => ({ product, qty: formNumber(values, `${prefix}_${product.id}`) }))

    function formNumber(values, name) {
      const value = Number(values.get(name) || 0);
      return Number.isFinite(value) ? value : 0;
    }

    function cleanText(value) {
      return String(value || '').trim();
