    function getDeviceLocation(options = {}) {
      if (!('geolocation' in navigator)) return Promise.reject(new Error('GPS tidak tersedia di perangkat ini.'));
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(
          position => resolve({
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            accuracy: position.coords.accuracy,
          }),
          () => reject(new Error('Lokasi gagal dibaca. Aktifkan GPS dan izinkan akses lokasi.')),
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000, ...options },
        );
      });
    }

    function employeeFence(point, lat, lng, radius, label) {
      const center = { lat: Number(lat), lng: Number(lng) };
      if (!Number.isFinite(center.lat) || !Number.isFinite(center.lng) || (center.lat === 0 && center.lng === 0)) {
        throw new Error(`Koordinat ${label} belum diatur oleh owner.`);
      }
      const distance = distanceMeters(point, center);
      return { distance, inside: distance <= Number(radius || 120) };
    }

    function distanceMeters(a, b) {
      const toRad = value => Number(value) * Math.PI / 180;
      const earthRadius = 6371000;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const lat1 = toRad(a.lat);
      const lat2 = toRad(b.lat);
      const value = Math.sin(dLat / 2) ** 2
        + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
      return earthRadius * 2 * Math.atan2(Math.sqrt(value), Math.sqrt(1 - value));
    }

    async function uploadEmployeePhoto({ shiftId, file, folder }) {
      if (!navigator.onLine) throw new Error('Upload foto membutuhkan koneksi internet.');
      const compressed = await compressEmployeeImage(file);
      const path = `${state.profile.tenant_id}/${shiftId}/${folder}/${crypto.randomUUID()}.jpg`;
      const { error } = await supabase.storage.from('shift-photos').upload(path, compressed, {
        upsert: false,
        contentType: compressed.type || 'image/jpeg',
      });
      if (error) throw error;
      return path;
    }

    async function compressEmployeeImage(file) {
      if (!file || !file.size) return file;
      if (!('createImageBitmap' in window)) return file;
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1280 / bitmap.width, 1280 / bitmap.height, 1);
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      const context = canvas.getContext('2d');
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close?.();
      const blob = await new Promise((resolve, reject) => canvas.toBlob(
        result => result ? resolve(result) : reject(new Error('Foto gagal dikompres.')),
        'image/jpeg',
        .72,
      ));
      return new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' });
    }

    async function adminFunction(functionName, body) {
      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      const token = data.session?.access_token;
      if (!token) throw new Error('Sesi owner tidak aktif. Silakan login ulang.');
      let response;
      try {
        response = await fetch(`${state.config.url}/functions/v1/${functionName}`, {
          method: 'POST',
          headers: {
            authorization: `Bearer ${token}`,
            apikey: state.config.key,
            'content-type': 'application/json',
          },
          body: JSON.stringify(body),
        });
      } catch {
        throw new Error(`Edge Function ${functionName} belum bisa diakses. Deploy function dengan --no-verify-jwt dan pastikan SERVICE_ROLE_KEY sudah diset.`);
      }
      const payload = await response.json().catch(() => null);
      if (!response.ok || payload?.error) throw new Error(functionErrorMessage(payload, functionName));
      return payload;
    }

    function functionErrorMessage(payload, functionName) {
      const messages = {
        EMPLOYEE_CODE_EXISTS: 'Kode karyawan sudah dipakai.',
        PHONE_EXISTS: 'Nomor HP sudah dipakai.',
        INVALID_PAYLOAD: 'Data belum lengkap atau PIN bukan 6 digit.',
        UNAUTHORIZED: 'Sesi owner tidak valid. Silakan login ulang.',
        FORBIDDEN: 'Akun ini tidak punya akses owner/manager.',
        TARGET_NOT_FOUND: 'Karyawan tidak ditemukan.',
        METHOD_NOT_ALLOWED: 'Metode request Edge Function tidak valid.',
      };
      if (payload?.error === 'INTERNAL_ERROR' && payload?.message) {
        return `Edge Function ${functionName} error: ${payload.message}`;
      }
      return messages[payload?.error] || `Edge Function ${functionName} gagal diproses.`;
    }

        selectOutletLocationPoint(outletMapPointButton.dataset.outletMapPoint);

      const employeeRouteButton = event.target.closest('[data-employee-route]');
      if (employeeRouteButton) {

          employeeRouteButton.dataset.employeeRoute,
          employeeRouteButton.dataset.employeeOp || '',
        );

      }

      const employeeOperationButton = event.target.closest('[data-employee-op]');
      if (employeeOperationButton) {
        state.employeeOperation = employeeOperationButton.dataset.employeeOp;
        await renderEmployeePage();
        return;

      const routeButton = event.target.closest('[data-route]');

        history.replaceState(null, '', `#/${state.route}`);

        openDetailPage(detailButton.dataset.viewDetail, detailButton.dataset.id);

      const toggleButton = event.target.closest('[data-toggle-row]');
      if (toggleButton) {
        toggleDataRow(toggleButton.dataset.resource, toggleButton.dataset.toggleRow);
        return;
      }

      const dataRow = event.target.closest('.data-row[data-row-key]');
      if (dataRow && !event.target.closest('button, a, input, select, textarea')) {
        toggleDataRow(dataRow.dataset.resource, dataRow.dataset.rowKey);
        return;
      }

      const openButton = event.target.closest('[data-open-form]');
      if (openButton) {
        await openForm(openButton.dataset.openForm, openButton.dataset.id || null);
        return;
      }

      const deleteButton = event.target.closest('[data-delete]');
      if (deleteButton) {
        await deleteResource(deleteButton.dataset.delete, deleteButton.dataset.id);
        return;
      }

      const confirmButton = event.target.closest('[data-confirm-delete]');
      if (confirmButton) {
        await confirmDelete(confirmButton.dataset.confirmDelete, confirmButton.dataset.id);
        return;
      }

      const resetButton = event.target.closest('[data-reset-pin]');
      if (resetButton) {
        await openResetPin(resetButton.dataset.resetPin, resetButton.dataset.rowId);
        return;
      }

      const action = event.target.closest('[data-action]')?.dataset.action;
      const actionButton = event.target.closest('[data-action]');
      if (action === 'open-employee-camera') {
        await openEmployeeCamera(actionButton.dataset.cameraKind);
        return;
      }
      if (action === 'capture-employee-photo') {
        await captureEmployeePhoto(actionButton.dataset.cameraKind, actionButton);
        return;
      }
      if (action === 'choose-employee-photo') {
        chooseEmployeePhoto(actionButton.dataset.cameraKind);
        return;
      }
      if (action === 'close-employee-camera') {
        closeEmployeeCamera();
        return;
      }
      if (action === 'use-current-outlet-location') {
        await useCurrentOutletLocation(actionButton);
        return;
      }
      if (action === 'open-drawer') document.body.classList.add('drawer-open');
      if (action === 'close-drawer') document.body.classList.remove('drawer-open');
      if (action === 'close-modal') closeModal();
      if (action === 'toggle-theme') toggleTheme();
      if (action === 'send-employee-location') await sendEmployeeLocation(event.target.closest('[data-action]'));
      if (action === 'logout') await logout();
      if (action === 'reset-config') {
        localStorage.removeItem(CONFIG_STORAGE_KEY);
        location.reload();
      }
    });

    document.addEventListener('change', event => {
      const photoInput = event.target.closest?.('[data-photo-input]');
      if (!photoInput) return;
      const file = photoInput.files?.[0];
      if (file) setEmployeePhoto(photoInput.dataset.photoInput, file);
    });

    document.addEventListener('keydown', event => {
      const dataRow = event.target.closest?.('.data-row[data-row-key]');
      if (!dataRow || !['Enter', ' '].includes(event.key)) return;
      event.preventDefault();
      toggleDataRow(dataRow.dataset.resource, dataRow.dataset.rowKey);
    });

    document.addEventListener('submit', async event => {
      const form = event.target.closest('form');
      if (!form?.dataset.submit) return;
      event.preventDefault();
      const action = form.dataset.submit;
      if (action === 'save-config') return saveConfig(form);
      if (action === 'owner-login') return ownerLogin(form);
      if (action === 'employee-login') return employeeLogin(form);
      if (action === 'employee-checkin') return employeeCheckIn(form);
      if (action === 'employee-initial-report') return employeeSubmitInitialReport(form);
      if (action === 'employee-sale') return employeeAddSale(form);
      if (action === 'employee-expense') return employeeAddExpense(form);
      if (action === 'employee-supply') return employeeAddSupply(form);
      if (action === 'employee-waste') return employeeAddWaste(form);
      if (action === 'employee-periodic') return employeeAddPeriodicReport(form);
      if (action === 'employee-final-report') return employeeSubmitFinalReport(form);
      if (action === 'employee-checkout') return employeeCheckOut(form);
      if (action === 'save-resource') return saveResource(form);
      if (action === 'reset-pin') return resetPin(form);
    });

    window.addEventListener('hashchange', () => {
      routeFromHash();
      if (!state.session) return;
      if (isOwner()) renderOwnerShell();
      else renderEmployeeShell();
    });

    function saveConfig(form) {
      const data = new FormData(form);
      localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify({
        url: String(data.get('url') || '').trim(),
        key: String(data.get('key') || '').trim(),
      }));
      location.reload();
    }

    async function ownerLogin(form) {
      const data = new FormData(form);
      disableForm(form, true);
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: String(data.get('email') || '').trim(),
          password: String(data.get('password') || ''),
        });
        if (error) throw error;
      } catch (error) {
        toast(error.message || 'Login gagal.', 'error');
      } finally {
        disableForm(form, false);
      }
    }

    async function employeeLogin(form) {
      const data = new FormData(form);
      const identifier = String(data.get('identifier') || '').trim();
      const pin = String(data.get('pin') || '').trim();
      if (!/^[0-9]{6}$/.test(pin)) {
        toast('PIN harus 6 digit.', 'error');
        return;
      }
      disableForm(form, true);
      try {
        const { data: resolved, error } = await supabase.rpc('resolve_employee_login', {
          identifier_input: identifier,
        });
        if (error) throw error;
        if (!resolved?.found) throw new Error('Kode karyawan atau nomor HP tidak ditemukan.');
        const credentials = resolved.email
          ? { email: resolved.email, password: pin }
          : { phone: resolved.phone, password: pin };
        const result = await supabase.auth.signInWithPassword(credentials);
        if (result.error) throw result.error;
      } catch (error) {
        toast(error.message || 'Login karyawan gagal.', 'error');
      } finally {
        disableForm(form, false);
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      state.session = null;
      state.user = null;
      state.profile = null;
      state.cache = {};
      resetEmployeeWorkspace();
      renderLogin();
    }

    function resetEmployeeWorkspace() {
      stopEmployeeCamera();
      clearAllEmployeePhotos();
      state.employee = null;
      state.employeeAssignments = [];
      state.employeeOutlets = [];
      state.employeeShift = null;
      state.employeeProducts = [];
      state.employeeHistory = [];
      state.employeeLoaded = false;
      state.employeeShiftLoaded = false;
      state.employeeProductsFor = null;
      state.employeeRoute = 'home';
      state.employeeOperation = 'sale';
    }

    function openModal(title, body) {
      destroyOutletLocationMap();
      modalRoot.innerHTML = `
        <div class="modal-backdrop">
          <section class="modal" role="dialog" aria-modal="true">
            <div class="modal-head">
              <div>
                <h2 class="modal-title">${esc(title)}</h2>
                <p class="help">Form ringan, data tersimpan langsung ke Supabase.</p>
              </div>
              <button class="btn ghost small" type="button" data-action="close-modal">X</button>
            </div>
            <div class="modal-body">${body}</div>
          </section>
        </div>`;
    }

    function closeModal() {
      stopEmployeeCamera();
      destroyOutletLocationMap();
      modalRoot.innerHTML = '';
      state.formContext = null;
    }

    function disableForm(form, disabled) {
      [...form.elements].forEach(element => {
        element.disabled = disabled;
      });
    }

    function brandHtml(size = '') {
      return `
        <div class="brand-block ${size === 'small' ? 'brand-small' : ''}">
          ${logoHtml()}
          <div>
            <p class="brand-title">Pentol Surya</p>
            <div class="brand-subtitle">Sistem operasional multi outlet.</div>
          </div>
        </div>`;
    }

    function logoHtml() {
      return `
        <div class="logo">
          <img src="./public/brand/pentol-surya-logo.png" alt="Logo Pentol Surya" onerror="this.replaceWith(document.createTextNode('PS'))">
        </div>`;
    }

    function kpiCard(label, value) {
      return `<div class="kpi-card"><div class="kpi-label">${esc(label)}</div><div class="kpi-value">${esc(value)}</div></div>`;
    }

    function miniTable(rows, headers, mapRow) {
      if (!rows.length) return '<div class="empty">Belum ada data.</div>';
      return `
        <div class="table-wrap">
          <table class="mini-table">
            <thead><tr>${headers.map(header => `<th>${esc(header)}</th>`).join('')}</tr></thead>
            <tbody>
              ${rows.map(row => `<tr>${mapRow(row).map((value, index) => `<td data-label="${esc(headers[index] || 'Data')}">${safeCell(value)}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function payrollItemsDetailHtml(rows) {
      return `
        <div class="panel" style="padding:0;border:0;box-shadow:none">
          <div class="panel-title"><span>Rincian gaji karyawan</span><span class="badge">${rows.length} data</span></div>
          ${miniTable(rows, ['Karyawan', 'Durasi', 'Total'], row => [
            row.employees?.user_profiles?.full_name || row.employees?.employee_code || '-',
            durationText(row.total_minutes),
            money(row.total_amount),
          ])}
        </div>`;
    }

    function safeCell(value) {
      const text = value == null || value === '' ? '-' : String(value);
      if (text.includes('<span') || text.includes('<div') || text.includes('<button')) return text;
      return esc(text);
    }

    function plainCellText(value) {
      return String(value ?? '-').replace(/<[^>]*>/g, '').trim() || '-';
    }

    function prettyJson(value) {
      if (value == null) return '-';
      try {
        return JSON.stringify(value, null, 2);
      } catch {
        return String(value);
      }
    }

    function coordinateText(lat, lng) {
      if (lat == null || lng == null || lat === '' || lng === '') return '-';
      return `${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}`;
    }

    function arrayText(value) {
      return Array.isArray(value) && value.length ? value.join(', ') : '-';
    }

    function durationText(totalMinutes) {
      const minutes = Math.max(0, Number(totalMinutes || 0));
      const hours = Math.floor(minutes / 60);
      const remainder = Math.round(minutes % 60);
      return `${hours} jam ${remainder} menit`;
    }

    function shiftDurationText(start, end) {
      if (!start) return '-';
      const startTime = new Date(start).getTime();
      const endTime = end ? new Date(end).getTime() : Date.now();
      if (!Number.isFinite(startTime) || !Number.isFinite(endTime)) return '-';
      return durationText(Math.max(0, Math.round((endTime - startTime) / 60000)));
    }

    function cssEscape(value) {
      if (window.CSS?.escape) return window.CSS.escape(String(value));
      return String(value).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
    }

    function badge(ok, text) {
      return `<span class="badge ${ok ? 'ok' : 'warn'}">${esc(text)}</span>`;
    }

    function activeOptions() {
      return [
        { value: 'true', label: 'Aktif' },
        { value: 'false', label: 'Nonaktif' },
      ];
    }

    function stockMethodOptions() {
      return [
        { value: 'default_qty', label: 'Qty default' },
        { value: 'previous_remaining', label: 'Sisa shift sebelumnya' },
      ];
    }

    function reportModeOptions() {
      return [
        { value: 'free', label: 'Bebas' },
        { value: 'scheduled', label: 'Jam tertentu' },
      ];
    }

    function payrollStatusOptions() {
      return [
        { value: 'draft', label: 'Draft' },
        { value: 'final', label: 'Final' },
        { value: 'paid', label: 'Sudah dibayar' },
      ];
    }

    function outletOptions() {
      return [
        { value: '', label: 'Pilih outlet' },
        ...(state.cache.activeOutlets || []).map(outlet => ({ value: outlet.id, label: outlet.name })),
      ];
    }

    function productOptions() {
      return [
        { value: '', label: 'Pilih produk' },
        ...(state.cache.activeProducts || []).map(product => ({ value: product.id, label: product.name })),
      ];
    }

    function stockMethodLabel(value) {
      return value === 'previous_remaining' ? 'Sisa shift sebelumnya' : 'Qty default';
    }

    function payrollStatusLabel(value) {
      return { draft: 'Draft', final: 'Final', paid: 'Sudah dibayar' }[value] || value || '-';
    }

    function shiftStatusLabel(value) {
      return {
        draft: 'Draft',
        active: 'Aktif',
        final_reported: 'Laporan akhir',
        closed: 'Selesai',
        cancelled: 'Dibatalkan',
      }[value] || value || '-';
    }

    function valueOrEmpty(result) {
      if (result.status === 'fulfilled') return Array.isArray(result.value) ? result.value : [];
      return [];
    }

    function uniqueBy(list, keyFn) {
      const map = new Map();
      list.forEach(item => {
        const key = keyFn(item);
        if (!map.has(key)) map.set(key, item);
      });
      return [...map.values()];
    }

    function todayRange() {
      const start = new Date();
      start.setHours(0, 0, 0, 0);
      const end = new Date(start);
      end.setDate(end.getDate() + 1);
      return { start: start.toISOString(), end: end.toISOString() };
    }

    function todayDate() {
      const date = new Date();
      const offset = date.getTimezoneOffset();
      return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
    }

    function money(value) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0,
      }).format(Number(value || 0));
    }

    function numberText(value) {
      return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 2 }).format(Number(value || 0));
    }

    function dateText(value) {
      if (!value) return '-';
      return new Intl.DateTimeFormat('id-ID', { dateStyle: 'medium' }).format(new Date(value));
    }

    function dateTimeText(value) {
      if (!value) return '-';
      return new Intl.DateTimeFormat('id-ID', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(value));
    }

    function shortId(value) {
      return value ? String(value).slice(0, 8) : '-';
    }

    function cleanObject(object) {
      return Object.fromEntries(Object.entries(object).filter(([, value]) => value !== undefined && value !== null && value !== ''));
    }

    function readJson(value) {
      try {
        return JSON.parse(value);
      } catch {
        return null;
      }
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }

    function toast(message, type = '') {
      const node = document.createElement('div');
      node.className = `toast ${type}`;
      node.textContent = message;
      toastRoot.appendChild(node);
      setTimeout(() => node.remove(), 4200);
    }

    function routeFromHash() {
      const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
      if (parts[0] === 'employee') {
        const employeeRoute = parts[1] || 'home';
        state.employeeRoute = ['home', 'operations', 'close', 'account'].includes(employeeRoute) ? employeeRoute : 'home';
        return;
      }
      if (parts[0] === 'detail' && tableConfigs[parts[1]]?.detailPage && parts[2]) {
        state.route = 'detail';
        state.detailContext = {
          resourceKey: parts[1],
          rowId: decodeURIComponent(parts.slice(2).join('/')),
        };
        return;
      }
      const route = parts[0] || 'dashboard';
      const validRoutes = ['dashboard', ...Object.keys(tableConfigs), 'settings'];
      state.route = validRoutes.includes(route) ? route : 'dashboard';
      state.detailContext = null;
    }

    function unregisterOldServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(registrations => registrations.forEach(registration => registration.unregister()))
          .catch(() => {});
      }
      if ('caches' in window) {
        caches.keys()
          .then(keys => keys.filter(key => key.includes(CACHE_PREFIX)).forEach(key => caches.delete(key)))
          .catch(() => {});
      }
    }
  </script>
</body>
</html>
